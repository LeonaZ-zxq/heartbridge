name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Only the light dependency set. The suite is designed to run without
        # torch, without network access and without an API key — that is the
        # whole point of the mock LLM provider and the pure-Python BM25 path.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Retrieval evaluation (dev + held-out, BM25)
        # Evaluation is part of CI, not a thing I ran once. If a knowledge-base
        # edit tanks retrieval, the pipeline says so on the pull request.
        run: python scripts/eval_retrieval.py --backends bm25 --set both

      - name: Crisis-detection evaluation
        # This step exits non-zero on ANY missed crisis case. Crisis recall is
        # a release gate, not a dashboard number.
        run: python scripts/eval_safety.py
